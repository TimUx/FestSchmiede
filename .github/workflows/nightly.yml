name: Nightly QA

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  CORS_ORIGIN: http://localhost:5173
  QA_API_BASE: http://localhost:3001/default/api
  QA_PLATFORM_API_BASE: http://localhost:3001/api
  QA_TENANT_SLUG: default
  QA_FRONTEND_BASE: http://localhost:5173
  QA_TENANT_FRONTEND_BASE: http://localhost:5173/default/
  QA_PLATFORM_ADMIN_EMAIL: platform@festschmiede.local
  QA_MAILPIT_BASE: http://localhost:8025
  QA_WORKFLOW: nightly

jobs:
  nightly:
    name: Lasttest & Nutzerreise
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Generate per-run CI secrets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          jwt_secret="$(openssl rand -hex 32)"
          encryption_key="$(openssl rand -hex 32)"
          admin_password="$(openssl rand -hex 24)"
          postgres_password="$(openssl rand -hex 24)"
          for value in "$jwt_secret" "$encryption_key" "$admin_password" "$postgres_password"; do
            echo "::add-mask::$value"
          done
          {
            echo "POSTGRES_PASSWORD=$postgres_password"
            echo "PLATFORM_ADMIN_PASSWORD=$admin_password"
            echo "DATABASE_URL=postgresql://festschmiede:${postgres_password}@localhost:5432/festschmiede"
            echo "JWT_SECRET=$jwt_secret"
            echo "APP_ENCRYPTION_KEY=$encryption_key"
            echo "QA_PLATFORM_ADMIN_PASSWORD=$admin_password"
            echo "COMPOSE_FILE=docker-compose.ci.yml:docker-compose.ci.override.yml"
          } >> "$GITHUB_ENV"
          cat > docker-compose.ci.override.yml <<EOF
          services:
            postgres:
              environment:
                POSTGRES_PASSWORD: ${postgres_password}
            backend:
              environment:
                DATABASE_URL: postgresql://festschmiede:${postgres_password}@postgres:5432/festschmiede
                JWT_SECRET: ${jwt_secret}
                APP_ENCRYPTION_KEY: ${encryption_key}
                PLATFORM_ADMIN_PASSWORD: ${admin_password}
          EOF

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend

      - name: Start CI stack
        run: |
          docker compose -f docker-compose.ci.yml -f docker-compose.ci.override.yml up -d --build
          npm run qa:wait

      - name: Large database seed (1000 orders)
        run: |
          npm run prisma:generate --prefix backend
          (cd backend && npm run seed)
          npm run qa:seed:nightly

      - name: Mandantenbewerbungen für Nutzerreise aktivieren
        run: npm run qa:prepare-journey

      - name: Backend neu starten (Plattform-Settings-Cache)
        run: |
          docker compose -f docker-compose.ci.yml -f docker-compose.ci.override.yml restart backend
          npm run qa:wait

      - name: Performance baseline
        run: npm run qa:performance

      - name: Security audit
        run: npm run qa:security

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Realistische Nutzerreise (E2E)
        run: npm run qa:e2e:journey

      - name: Report
        if: always()
        run: npm run qa:report || true

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-qa-artifacts
          path: artifacts/

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml -f docker-compose.ci.override.yml down -v
