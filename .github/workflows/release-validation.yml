name: Release Validation

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to validate'
        required: false

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  CORS_ORIGIN: http://localhost:5173
  QA_FRONTEND_BASE: http://localhost:5173
  QA_PLATFORM_ADMIN_EMAIL: platform@festschmiede.local
  QA_MAILPIT_BASE: http://localhost:8025

jobs:
  validate:
    name: Release-Gate (Build + Nutzerreise)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Generate per-run CI secrets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          jwt_secret="$(openssl rand -hex 32)"
          encryption_key="$(openssl rand -hex 32)"
          admin_password="$(openssl rand -hex 24)"
          postgres_password="$(openssl rand -hex 24)"
          for value in "$jwt_secret" "$encryption_key" "$admin_password" "$postgres_password"; do
            echo "::add-mask::$value"
          done
          {
            echo "POSTGRES_PASSWORD=$postgres_password"
            echo "PLATFORM_ADMIN_PASSWORD=$admin_password"
            echo "DATABASE_URL=postgresql://festschmiede:${postgres_password}@localhost:5432/festschmiede"
            echo "JWT_SECRET=$jwt_secret"
            echo "APP_ENCRYPTION_KEY=$encryption_key"
            echo "QA_PLATFORM_ADMIN_PASSWORD=$admin_password"
            echo "COMPOSE_FILE=docker-compose.ci.yml:docker-compose.ci.override.yml"
          } >> "$GITHUB_ENV"
          cat > docker-compose.ci.override.yml <<EOF
          services:
            postgres:
              environment:
                POSTGRES_PASSWORD: ${postgres_password}
            backend:
              environment:
                DATABASE_URL: postgresql://festschmiede:${postgres_password}@postgres:5432/festschmiede
                JWT_SECRET: ${jwt_secret}
                APP_ENCRYPTION_KEY: ${encryption_key}
                PLATFORM_ADMIN_PASSWORD: ${admin_password}
          EOF

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Generate Prisma client
        run: npm run prisma:generate --prefix backend

      - name: Quality gate (schnell)
        run: |
          npm run qa:typecheck
          npm run qa:unit

      - name: Docker stack + Nutzerreise
        run: |
          docker compose -f docker-compose.ci.yml -f docker-compose.ci.override.yml up -d --build
          npm run qa:wait
          (cd backend && npm run seed)
          npm run qa:prepare-journey
          docker compose -f docker-compose.ci.yml -f docker-compose.ci.override.yml restart backend
          npm run qa:wait
          npx playwright install chromium --with-deps
          npm run qa:e2e:journey
          npm run qa:security

      - name: Release gate report
        if: always()
        run: npm run qa:report || true

      - name: Upload release validation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-validation
          path: artifacts/

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml -f docker-compose.ci.override.yml down -v

  build-and-push:
    name: Docker Images (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            file: backend/Dockerfile
          - name: frontend
            context: frontend
            file: frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Resolve release tag
        id: release
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tag != '' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'release' }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: image
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '' }}
            VITE_WS_URL=${{ vars.VITE_WS_URL || '' }}
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY || '' }}

      - name: Enforce immutable image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" == sha256:* ]] || {
            echo "Release images must be published with a sha256 digest." >&2
            exit 1
          }
          printf '%s  %s\n' "$IMAGE_DIGEST" "${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}" \
            >> "image-digests-${{ matrix.name }}.txt"

      - name: Upload image checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-digests-${{ matrix.name }}
          path: image-digests-${{ matrix.name }}.txt
