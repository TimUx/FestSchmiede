name: Container Scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan ${{ matrix.name }} image
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: 0.70.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            file: backend/Dockerfile
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --file "${{ matrix.file }}" --tag "festschmiede/${{ matrix.name }}:${{ github.sha }}" "${{ matrix.context }}"

      - name: Install Trivy
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          release_url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            "${release_url}/${archive}" --output "${RUNNER_TEMP}/${archive}"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            "${release_url}/trivy_${TRIVY_VERSION}_checksums.txt" --output "${RUNNER_TEMP}/checksums.txt"
          (
            cd "${RUNNER_TEMP}"
            grep -F "  ${archive}" checksums.txt | sha256sum --check --status
          )
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" trivy
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: festschmiede/${{ matrix.name }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
